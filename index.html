<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Quản trị hồ sơ</title>
<style>
:root{--navy:#12305e;--navy2:#1c4a8f;--red:#c0182b;--bg:#eef2f8;--line:#d3dced;--muted:#5d6b82;--ok:#127a4b}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);color:#101827;font-size:15px}
header{background:var(--navy);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:10}
header .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.04em}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.tools{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.tools a,.tools button{display:inline-block;background:#fff;border:1px solid var(--line);color:var(--navy);
  padding:9px 13px;border-radius:9px;text-decoration:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.tools a:hover,.tools button:hover{background:#f3f7fd}
input.s{flex:1;min-width:210px;padding:10px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px;font-family:inherit}
.stats{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.st{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 16px;min-width:112px}
.st b{display:block;font-size:22px;color:var(--navy);line-height:1.2}
.st span{font-size:12.5px;color:var(--muted)}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}
th{background:#f5f8fc;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
tr:last-child td{border-bottom:none}
tr.r:hover{background:#f7faff;cursor:pointer}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.t-nop{background:#e6f4ec;color:var(--ok)}
.t-nhap{background:#fdf3e0;color:#95610d}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;color:var(--navy)}
.empty{padding:44px;text-align:center;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:11px}
.mask{position:fixed;inset:0;background:rgba(16,24,39,.55);display:none;z-index:50;overflow:auto;padding:24px 12px}
.mask.on{display:block}
.modal{max-width:760px;margin:0 auto;background:#fff;border-radius:14px;padding:20px}
.modal h2{margin:0 0 3px;color:var(--navy);font-size:19px}
.rv{display:flex;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.rv b{flex:0 0 210px;color:var(--muted);font-weight:600}
.rv span{flex:1}
h4{margin:18px 0 4px;color:var(--navy);font-size:14.5px;text-transform:uppercase;letter-spacing:.04em}
.x{float:right;border:none;background:#eef2f8;border-radius:9px;padding:7px 12px;cursor:pointer;font-size:14px;font-family:inherit}
.dl{background:#12305e;color:#fff;border:none;padding:9px 14px;border-radius:9px;font-weight:700;cursor:pointer;font-family:inherit}
.dl2{background:#e8edf6;color:#12305e;border:none;padding:9px 14px;border-radius:9px;font-weight:700;cursor:pointer;font-family:inherit}
.dl:disabled,.dl2:disabled{opacity:.45;cursor:default}
.dg{background:#fdeaec;color:var(--red);border:none;padding:9px 14px;border-radius:9px;font-weight:700;cursor:pointer;font-family:inherit}
.xoaD{background:#fdeaec;border:1px solid #f3c6cc;color:var(--red);font-size:12.5px;font-weight:700;
  padding:5px 10px;border-radius:8px;cursor:pointer;font-family:inherit;white-space:nowrap}
.xoaD:hover{background:#fbd9de}
@media(max-width:640px){ .hide-m{display:none} .rv b{flex:0 0 130px} }
</style>
</head>
<body>
<header><div class="in"><h1>QUẢN TRỊ HỒ SƠ – NHAT TAN MANPOWER</h1></div></header>

<div class="wrap">
  <div class="stats" id="stats"></div>
  <div class="tools">
    <input class="s" id="q" placeholder="Tìm theo tên, mã hồ sơ, số điện thoại…" oninput="ve()">
    <a id="lSheet" target="_blank">Mở bảng dữ liệu</a>
    <a id="lFolder" target="_blank">Thư mục ảnh</a>
    <button onclick="chepLink()">Chép link cho học sinh</button>
    <button onclick="taiLai()">Tải lại</button>
  </div>
  <div id="ds"></div>
</div>

<div class="mask" id="mask" onclick="if(event.target===this)dong()">
  <div class="modal" id="modal"></div>
</div>

<script>
/* ------------------------------------------------------------------
 * Cầu nối: giữ nguyên cú pháp google.script.run nhưng gọi sang API JSON
 * của Apps Script bằng fetch. Nhờ vậy trang có thể đặt ở GitHub Pages,
 * không còn lỗi 404 khi Chrome đăng nhập nhiều tài khoản Google.
 * ------------------------------------------------------------------ */
var API_URL = 'https://script.google.com/macros/s/AKfycbz6y0x9OKxOshCP62lQKaNW6jilZLsCEmU9oZ5PSCpNg--OstPnenhFldOQGbxnkjuh/exec';
var WEB_URL = (/^qlcv\./i.test(location.hostname))
  ? 'https://cv.nhattangroup.vn/'
  : location.origin + location.pathname.replace(/[^/]*$/, 'index.html');
var google = (function () {
  var FNS = ['taiNhap', 'luuNhap', 'nopHoSo', 'dsHoSo', 'chiTiet', 'xoaHoSo', 'xuatCV', 'taiAnh'];
  function tao(succ, fail) {
    var api = {
      withSuccessHandler: function (f) { return tao(f, fail); },
      withFailureHandler: function (f) { return tao(succ, f); }
    };
    FNS.forEach(function (fn) {
      api[fn] = function () {
        var args = Array.prototype.slice.call(arguments);
        var than = JSON.stringify({ fn: fn, args: args });
        var lan = 0;

        function goi() {
          lan++;
          var huy = (typeof AbortController !== 'undefined') ? new AbortController() : null;
          var dongHo = setTimeout(function () { if (huy) huy.abort(); }, 90000);
          fetch(API_URL, {
            method: 'POST',
            redirect: 'follow',
            body: than,
            signal: huy ? huy.signal : undefined
          })
            .then(function (r) { return r.text(); })
            .then(function (t) {
              clearTimeout(dongHo);
              var j;
              try { j = JSON.parse(t); }
              catch (e) { throw new Error('__MANG__'); }   // thường là trang lỗi tạm của Google
              if (j && j.ok) { if (succ) succ(j.kq); }
              else { if (fail) fail(new Error((j && j.loi) || 'Lỗi máy chủ')); }
            })
            .catch(function (e) {
              clearTimeout(dongHo);
              // lỗi mạng / Google chập chờn -> thử lại tối đa 3 lần
              if (lan < 3) { setTimeout(goi, lan * 900); return; }
              if (fail) fail(new Error('Mạng chập chờn, chưa gọi được máy chủ. Em thử lại nhé.'));
              else console.error(e);
            });
        }
        goi();
      };
    });
    return api;
  }
  return { script: { run: tao(null, null), host: { close: function () {} } } };
})();

var KEY = (new URLSearchParams(location.search).get('key')||'').trim();
var SCHEMA = {"sections":[{"id":"canhan","title":"Thông tin cá nhân","desc":"Khai đúng theo căn cước công dân.","fields":[{"k":"hoten","q":"Họ và tên","t":"text","req":1,"up":1,"hint":"Viết có dấu, ví dụ: Nguyễn Văn An"},{"k":"ngaysinh","q":"Ngày sinh","t":"date","req":1},{"k":"gioitinh","q":"Giới tính","t":"select","req":1,"opts":["Nam","Nữ"]},{"k":"chieucao","q":"Chiều cao (cm)","t":"num","req":1},{"k":"cannang","q":"Cân nặng (kg)","t":"num","req":1},{"k":"quequan","q":"Quê quán (tỉnh/thành phố)","t":"text","req":1},{"k":"nhommau","q":"Nhóm máu","t":"select","req":1,"opts":["A","B","O","AB","Không rõ"]},{"k":"canthi","q":"Cận thị","t":"select","req":1,"opts":["Có","Không"]},{"k":"mumau","q":"Mù màu","t":"select","req":1,"opts":["Có","Không"]},{"k":"taythuan","q":"Tay thuận","t":"select","req":1,"opts":["Phải","Trái","Cả hai"]},{"k":"sdt","q":"Số điện thoại (bản thân)","t":"tel","req":1},{"k":"sdtnt","q":"Số điện thoại (người thân)","t":"tel","req":1},{"k":"honnhan","q":"Tình trạng hôn nhân","t":"select","req":1,"opts":["Độc thân","Đã kết hôn","Ly hôn"]},{"k":"banglai","q":"Bằng lái xe","t":"select","opts":["Không có","Xe máy","Ô tô","Xe máy + Ô tô"]},{"k":"hutthuoc","q":"Hút thuốc","t":"select","req":1,"opts":["Có","Không"]},{"k":"ruoubia","q":"Rượu, bia","t":"select","req":1,"opts":["Có","Không"]},{"k":"hinhxam","q":"Hình xăm","t":"select","req":1,"opts":["Có","Không"]},{"k":"hokhau","q":"Địa chỉ hộ khẩu","t":"text","req":1},{"k":"mien","q":"Miền","t":"select","req":1,"opts":["Bắc","Trung","Nam"]},{"k":"monhoc","q":"Môn học yêu thích","t":"text"},{"k":"sogiay","q":"Số giày","t":"num"}]},{"id":"khac","title":"Nguyện vọng & thông tin khác","desc":"","fields":[{"k":"sothich","q":"Sở thích","t":"text","req":1},{"k":"tiengnhat","q":"Trình độ tiếng Nhật","t":"text","hint":"Ví dụ: Chưa học / N5 / N4"},{"k":"uudiem","q":"Ưu điểm","t":"text","req":1},{"k":"hanche","q":"Hạn chế","t":"text","req":1},{"k":"muctieu","q":"Mục tiêu đi Nhật","t":"text","req":1},{"k":"sotien","q":"Số tiền muốn tích luỹ sau 3 năm","t":"text","req":1,"hint":"Ví dụ: 700.000.000 đồng"},{"k":"dudinh","q":"Dự định sau khi về nước","t":"text","req":1},{"k":"nguoithannhat","q":"Có người thân sống ở Nhật không","t":"select","req":1,"opts":["Có","Không"]},{"k":"dinuocngoai","q":"Đã từng đi nước ngoài chưa","t":"select","req":1,"opts":["Rồi","Chưa"]},{"k":"ghichu","q":"Tâm tư, nguyện vọng muốn bổ sung","t":"area"}]}],"groups":[{"id":"hocvan","title":"Quá trình đi học","desc":"Khai từ cấp 1 đến cấp học cao nhất.","add_label":"Thêm trường học","item_label":"Trường","auto_nam":1,"defaults":[{"_ten":"Cấp 1 (Tiểu học)"},{"_ten":"Cấp 2 (THCS)"},{"_ten":"Cấp 3 (THPT)"}],"fields":[{"k":"tu","q":"Từ tháng/năm","t":"month","req":1},{"k":"den","q":"Đến tháng/năm","t":"month","req":1},{"k":"truong","q":"Tên trường","t":"text","req":1},{"k":"diachi","q":"Địa chỉ (tỉnh)","t":"text"},{"k":"bang","q":"Có bằng tốt nghiệp","t":"select","opts":["Có","Không"]},{"k":"loai","q":"Loại trường","t":"select","tu_muc":4,"opts":["Đại học","Cao đẳng","Trung cấp nghề","Khác"]}]},{"id":"lamviec","title":"Quá trình làm việc","desc":"Chưa đi làm thì bấm xoá hết các mục bên dưới.","add_label":"Thêm nơi làm việc","item_label":"Nơi làm việc","auto_nam":0,"defaults":[{}],"fields":[{"k":"tu","q":"Từ tháng/năm","t":"month"},{"k":"den","q":"Đến tháng/năm","t":"month"},{"k":"donvi","q":"Tên công ty / tỉnh","t":"text","req":1},{"k":"cviec","q":"Nội dung công việc","t":"text","req":1}]},{"id":"giadinh","title":"Thành phần gia đình","desc":"Khai bố, mẹ, anh chị em ruột, vợ/chồng, con (nếu có).","add_label":"Thêm người thân","item_label":"Người thân","auto_nam":0,"defaults":[{"quanhe":"Bố"},{"quanhe":"Mẹ"}],"fields":[{"k":"quanhe","q":"Mối quan hệ","t":"text","req":1,"hint":"Bố / Mẹ / Anh trai / Em gái…"},{"k":"hoten","q":"Họ tên","t":"text","req":1},{"k":"namsinh","q":"Năm sinh","t":"num"},{"k":"noio","q":"Nơi ở hiện nay","t":"text"},{"k":"songchung","q":"Em sống chung hay riêng","t":"select","opts":["Chung","Riêng"]},{"k":"nghe","q":"Nghề nghiệp","t":"text"}]}]};
var rows = [], meta = {}, KHO = {};   // KHO: nhớ chi tiết hồ sơ đã mở
var dmy = v => { var m = String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3]+'/'+m[2]+'/'+m[1] : String(v||''); };
var esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function taiLai(){ KHO = {}; try{ localStorage.removeItem('ntm_ds'); }catch(e){} tai(); }

function tai(){
  var cu = null;
  try { cu = JSON.parse(localStorage.getItem('ntm_ds')||'null'); } catch(e){}
  if(cu && cu.rows){ rows = cu.rows; meta = cu; ve(); }
  else document.getElementById('ds').innerHTML = '<div class="empty">Đang tải…</div>';
  google.script.run.withSuccessHandler(r => {
    if(!r || !r.ok){ document.getElementById('ds').innerHTML='<div class="empty">Không tải được.</div>'; return; }
    rows = r.rows; meta = r;
    try { localStorage.setItem('ntm_ds', JSON.stringify(r)); } catch(e){}
    document.getElementById('lSheet').href = r.sheetUrl;
    document.getElementById('lFolder').href = r.folderUrl;
    ve();
  }).withFailureHandler(e => {
    document.getElementById('ds').innerHTML =
      '<div class="empty">Lỗi máy chủ: ' + esc(e && e.message ? e.message : e) + '</div>';
  }).dsHoSo(KEY);
}

function ve(){
  var q = (document.getElementById('q').value||'').toLowerCase().trim();
  var f = rows.filter(r => !q || [r.ma,r.hoten,r.sdt,r.quequan].join(' ').toLowerCase().indexOf(q)>=0);
  var nop = rows.filter(r=>r.trangthai==='Đã nộp').length;
  document.getElementById('stats').innerHTML =
    `<div class="st"><b>${rows.length}</b><span>Tổng hồ sơ</span></div>
     <div class="st"><b>${nop}</b><span>Đã nộp</span></div>
     <div class="st"><b>${rows.length-nop}</b><span>Đang khai dở</span></div>
     <div class="st"><b>${rows.filter(r=>r.coanh).length}</b><span>Có ảnh thẻ</span></div>`;

  if(!f.length){ document.getElementById('ds').innerHTML =
    '<div class="empty">'+(rows.length?'Không tìm thấy hồ sơ phù hợp.':'Chưa có hồ sơ nào.')+'</div>'; return; }

  document.getElementById('ds').innerHTML = `<table><thead><tr>
      <th>Mã</th><th>Họ tên</th><th class="hide-m">Ngày sinh</th><th>SĐT</th>
      <th class="hide-m">Quê quán</th><th>Trạng thái</th><th class="hide-m">Cập nhật</th>
      <th></th></tr></thead><tbody>` +
    f.map(r => `<tr class="r" onclick="xem('${r.ma}')">
      <td class="mono">${esc(r.ma)}</td>
      <td><b>${esc(r.hoten)||'(chưa điền tên)'}</b>${r.coanh?' 📷':''}</td>
      <td class="hide-m">${esc(dmy(r.ngaysinh))}</td>
      <td>${esc(r.sdt)}</td>
      <td class="hide-m">${esc(r.quequan)}</td>
      <td><span class="tag ${r.trangthai==='Đã nộp'?'t-nop':'t-nhap'}">${esc(r.trangthai)}</span></td>
      <td class="hide-m">${esc(r.capnhat_luc)}</td>
      <td><button class="xoaD" title="Xoá hồ sơ này"
           onclick="event.stopPropagation();xoa('${r.ma}','${esc(r.hoten).replace(/'/g,'')}')">Xoá</button></td></tr>`)
      .join('') + '</tbody></table>';
}

function xem(ma){
  document.getElementById('mask').classList.add('on');
  if(KHO[ma]){ veChiTiet(KHO[ma]); return; }
  document.getElementById('modal').innerHTML = '<div class="empty">Đang tải…</div>';
  google.script.run.withSuccessHandler(r => {
    if(!r || !r.ok){ document.getElementById('modal').innerHTML='<div class="empty">Không tải được.</div>'; return; }
    KHO[ma] = r; veChiTiet(r);
  }).withFailureHandler(e => {
    document.getElementById('modal').innerHTML =
      '<button class="x" onclick="dong()">Đóng</button><div class="empty">Lỗi máy chủ: ' +
      esc(e && e.message ? e.message : e) + '</div>';
  }).chiTiet(KEY, ma);
}

function veChiTiet(r){
  {
    var h = `<button class="x" onclick="dong()">Đóng</button>
      <h2>${esc(r.data.hoten)||'(chưa điền tên)'}</h2>
      <div style="color:#5d6b82;font-size:14px;margin-bottom:6px">Mã hồ sơ <b class="mono">${esc(r.ma)}</b> · ${esc(r.trangthai)}</div>`;
    if(r.coanh) h += `<div id="oAnh" style="width:120px;height:160px;border-radius:9px;border:1px solid #d3dced;margin:8px 0;background:#f3f7fd;display:flex;align-items:center;justify-content:center;font-size:12.5px;color:#5d6b82">${r.anh?'':'đang tải ảnh…'}</div>`;

    SCHEMA.sections.forEach(s => {
      h += `<h4>${esc(s.title)}</h4>`;
      s.fields.forEach(f => { var v = r.data[f.k];
        if(String(v||'').trim()) h += `<div class="rv"><b>${esc(f.q)}</b><span>${esc(f.k==='ngaysinh'?dmy(v):v)}</span></div>`; });
    });
    SCHEMA.groups.forEach(g => {
      var arr = r.groups[g.id]||[];
      h += `<h4>${esc(g.title)}</h4>`;
      if(!arr.length) h += `<div class="rv"><span style="color:#5d6b82">(không có)</span></div>`;
      arr.forEach((it,i) => {
        h += `<div class="rv"><b>${esc(it._ten||(g.item_label+' '+(i+1)))}</b><span>` +
             g.fields.map(f=>esc(it[f.k]||'')).filter(Boolean).join(' · ') + `</span></div>`;
      });
    });
    h += `<div style="margin-top:20px;display:flex;gap:9px;flex-wrap:wrap">
        <button class="dl" id="bCV" onclick="taiCV('${r.ma}')">⬇ Tải CV Excel</button>
        <button class="dl" id="bCVA" onclick="taiCVPdf('${r.ma}')">⬇ Tải CV PDF</button>
        <button class="dl2" id="bAnh" onclick="taiAnhVe('${r.ma}')"${r.coanh?'':' disabled'}>⬇ Tải ảnh thẻ</button>
        <button class="dg" onclick="xoa('${r.ma}')">Xoá hồ sơ này</button>
        <a class="tools" style="text-decoration:none" href="${WEB_URL}?ma=${r.ma}" target="_blank"
           ><button>Mở bản khai của học sinh</button></a></div>`;
    document.getElementById('modal').innerHTML = h;
    if(r.coanh) hienAnh(r);
  }
}

/** Ảnh thẻ tải sau, không bắt cửa sổ chi tiết phải chờ. */
function hienAnh(r){
  var o = document.getElementById('oAnh'); if(!o) return;
  if(r.anh && r.anh.thumb){ o.innerHTML = `<img src="${r.anh.thumb}" style="width:100%;height:100%;object-fit:cover">`; return; }
  google.script.run.withSuccessHandler(function(a){
    if(!a || !a.ok) { o.textContent = 'Không tải được ảnh'; return; }
    r.anh = { thumb: 'data:' + a.mime + ';base64,' + a.b64 };
    var o2 = document.getElementById('oAnh');
    if(o2) o2.innerHTML = `<img src="${r.anh.thumb}" style="width:100%;height:100%;object-fit:cover">`;
  }).withFailureHandler(function(){ o.textContent = 'Không tải được ảnh'; }).taiAnh(KEY, r.ma, true);
}

function dong(){ document.getElementById('mask').classList.remove('on'); }

function luuFile(b64, ten, mime){
  var bin = atob(b64), n = bin.length, u = new Uint8Array(n);
  for (var i = 0; i < n; i++) u[i] = bin.charCodeAt(i);
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([u], {type: mime || 'application/octet-stream'}));
  a.download = ten; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}

function taiCV(ma){
  var b = document.getElementById('bCV');
  b.disabled = true; b.textContent = 'Đang tạo file…';
  google.script.run.withSuccessHandler(function(r){
    b.disabled = false; b.textContent = '⬇ Tải CV Excel';
    if(!r || !r.ok){ alert('Không tạo được file.'); return; }
    luuFile(r.b64, r.ten, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  }).withFailureHandler(function(e){
    b.disabled = false; b.textContent = '⬇ Tải CV Excel';
    alert('Lỗi: ' + (e && e.message ? e.message : e));
  }).xuatCV(KEY, ma);
}

function taiCVPdf(ma){
  var b = document.getElementById('bCVA');
  b.disabled = true; b.textContent = 'Đang tạo PDF…';
  function xong(){ b.disabled = false; b.textContent = '⬇ Tải CV PDF'; }
  google.script.run.withSuccessHandler(function(r){
    xong();
    if(!r || !r.ok){ alert('Không tạo được file.'); return; }
    luuFile(r.b64, r.ten, 'application/pdf');
  }).withFailureHandler(function(e){
    xong(); alert('Lỗi: ' + (e && e.message ? e.message : e));
  }).xuatCV(KEY, ma, 'pdf');
}

function taiAnhVe(ma){
  var b = document.getElementById('bAnh');
  b.disabled = true; b.textContent = 'Đang tải…';
  google.script.run.withSuccessHandler(function(r){
    b.disabled = false; b.textContent = '⬇ Tải ảnh thẻ';
    if(!r || !r.ok){ alert(r && r.loi ? r.loi : 'Không tải được ảnh.'); return; }
    luuFile(r.b64, r.ten, r.mime);
  }).withFailureHandler(function(e){
    b.disabled = false; b.textContent = '⬇ Tải ảnh thẻ';
    alert('Lỗi: ' + (e && e.message ? e.message : e));
  }).taiAnh(KEY, ma);
}

function xoa(ma, ten){
  if(!confirm('Xoá vĩnh viễn hồ sơ ' + ma + (ten ? ' (' + ten + ')' : '') +
              '?\n\nToàn bộ thông tin và ảnh thẻ sẽ bị xoá, không lấy lại được.')) return;
  delete KHO[ma];
  try{ localStorage.removeItem('ntm_ds'); }catch(e){}
  document.getElementById('ds').innerHTML = '<div class="empty">Đang xoá…</div>';
  google.script.run.withSuccessHandler(function(){
    dong(); tai();
  }).withFailureHandler(function(e){
    alert('Không xoá được: ' + (e && e.message ? e.message : e)); tai();
  }).xoaHoSo(KEY, ma);
}

function chepLink(){
  var el = document.createElement('textarea');
  el.value = WEB_URL; document.body.appendChild(el); el.select();
  document.execCommand('copy'); document.body.removeChild(el);
  alert('Đã chép link:\n' + WEB_URL);
}
